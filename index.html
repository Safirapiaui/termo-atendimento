<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Termo de Atendimento</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>@media print{body{background:#fff!important;padding:0!important}.page{box-shadow:none!important;max-width:100%!important}.btn-area{display:none!important}}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f0f2f5;padding:10px;font-size:11px}.page{max-width:794px;margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12)}.header{background:linear-gradient(135deg,#003087,#0055c8);color:#fff;padding:8px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}.header-text h1{font-size:13px;letter-spacing:.5px;text-transform:uppercase}.header-text h2{font-size:9px;font-weight:400;opacity:.85;margin-top:1px}.proto-box{background:#fff;border-radius:5px;padding:4px 10px;min-width:200px;text-align:center}.proto-box label{font-size:8px;color:#003087;font-weight:700;text-transform:uppercase;display:block}.proto-box input{border:none;border-bottom:1.5px solid #003087;outline:none;font-size:13px;font-weight:700;color:#003087;text-align:center;background:transparent;width:100%}.body{padding:6px 12px 4px}.section-title{font-size:8px;font-weight:700;text-transform:uppercase;color:#fff;background:#003087;padding:2px 6px;margin-bottom:4px;margin-top:6px;letter-spacing:.5px}.row{display:flex;gap:8px;margin-bottom:4px;flex-wrap:nowrap}.field{display:flex;flex-direction:column;flex:1;min-width:0}.field label{font-size:7.5px;font-weight:700;color:#555;text-transform:uppercase;margin-bottom:1px;letter-spacing:.3px}.field input,.field select{border:none;border-bottom:1px solid #bbb;outline:none;font-size:10px;color:#111;padding:1px 2px;background:transparent;font-family:inherit;width:100%}.field textarea{resize:none;font-size:10px;border:1px solid #bbb;border-radius:2px;padding:3px 5px;font-family:inherit;width:100%;height:52px;color:#111}.tipo-group{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px}.tipo-group label{display:flex;align-items:center;gap:3px;font-size:10px;color:#222;cursor:pointer;font-weight:normal;text-transform:none;letter-spacing:0}.tipo-group input[type=radio]{accent-color:#003087;width:11px;height:11px}.prazo-info{font-size:8px;color:#c0392b;font-weight:700;margin-top:2px;display:none;padding:1px 5px;background:#fdf0ee;border-left:2px solid #c0392b}.prazo-info.visible{display:block}.sexo-group{display:flex;gap:10px;margin-top:2px}.sexo-group label{display:flex;align-items:center;gap:3px;font-size:10px;color:#222;cursor:pointer;font-weight:normal;text-transform:none;letter-spacing:0}.sig-row{display:flex;gap:20px;margin-top:8px}.sig-box{flex:1;text-align:center}.sig-line{border-top:1px solid #333;margin-bottom:3px}.sig-label{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:.3px}.sig-input{width:100%;border:none;outline:none;text-align:center;font-size:10px;color:#111;padding:2px 0;background:transparent;border-bottom:1px dashed #aaa;margin-bottom:2px;font-family:inherit}.btn-area{padding:8px;text-align:center;display:flex;gap:10px;justify-content:center}.btn{border:none;padding:8px 24px;font-size:12px;font-weight:700;border-radius:20px;cursor:pointer}.btn-pdf{background:linear-gradient(135deg,#003087,#0055c8);color:#fff;box-shadow:0 3px 10px rgba(0,85,200,.3)}.btn-print{background:#fff;color:#003087;border:2px solid #003087}</style></head><body><div class="page"><div class="header"><div class="header-text"><h1>Termo de Atendimento ao Consumidor</h1><h2>Concilie x TIM | PROCON</h2></div><div class="proto-box"><label>Protocolo Concilie</label><input type="text" id="proto_concilie" placeholder="No do protocolo" maxlength="30"></div></div><div class="body"><div class="section-title">Identificacao do Atendimento</div><div class="row"><div class="field" style="flex:1.5"><label>Cidade/PROCON</label><select id="cidade"><option value="">Selecione</option><option>Umuarama</option><option>Florianopolis</option><option>Maringa</option><option>Campo Mourao</option><option>Dois Vizinhos</option><option>Cascavel</option></select></div><div class="field"><label>Data</label><input type="date" id="data_atend"></div><div class="field"><label>Horario</label><input type="time" id="hora_atend"></div><div class="field"><label>Protocolo TIM</label><input type="text" id="proto_tim" placeholder="No protocolo TIM" maxlength="30"></div></div><div class="row"><div class="field"><label>Tipo de Consulta</label><div class="tipo-group"><label><input type="radio" name="tipo" value="0800 PROCON" onchange="togglePrazo(this)"> 0800 PROCON</label><label><input type="radio" name="tipo" value="0800 com protocolo" onchange="togglePrazo(this)"> 0800 com protocolo</label><label><input type="radio" name="tipo" value="Simples Consulta" onchange="togglePrazo(this)"> Simples Consulta</label></div><div class="prazo-info" id="prazo_info">Prazo de 5 dias uteis para retorno</div></div></div><div class="section-title">Dados do Consumidor</div><div class="row"><div class="field" style="flex:3"><label>Nome Completo</label><input type="text" id="nome" placeholder="Nome completo"></div><div class="field" style="flex:1.5"><label>CPF</label><input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="maskCPF(this)"></div><div class="field" style="flex:1.2"><label>Nascimento</label><input type="date" id="nasc"></div></div><div class="row"><div class="field"><label>Sexo</label><div class="sexo-group"><label><input type="radio" name="sexo" value="Feminino"> Feminino</label><label><input type="radio" name="sexo" value="Masculino"> Masculino</label></div></div><div class="field" style="flex:1.5"><label>Num Reclamado</label><input type="text" id="num_reclamado" placeholder="(00)00000-0000" maxlength="15" oninput="maskPhone(this)"></div><div class="field" style="flex:1.5"><label>Num Contato</label><input type="text" id="num_contato" placeholder="(00)00000-0000" maxlength="15" oninput="maskPhone(this)"></div><div class="field" style="flex:2"><label>E-mail</label><input type="email" id="email" placeholder="email@exemplo.com"></div></div><div class="section-title">Reclamacao do Consumidor</div><div class="field" style="margin-bottom:4px"><textarea id="reclamacao" placeholder="Descreva a reclamacao..."></textarea></div><div class="section-title">Proposta da Operadora</div><div class="field" style="margin-bottom:4px"><textarea id="proposta" placeholder="Proposta da TIM..."></textarea></div><div class="section-title">Assinaturas</div><div class="sig-row"><div class="sig-box"><div class="sig-line"></div><input class="sig-input" id="nome_consumidor_assin" type="text" placeholder="Nome do Consumidor"><div class="sig-label">Consumidor</div></div><div class="sig-box"><div class="sig-line"></div><input class="sig-input" id="nome_conciliador" type="text" placeholder="Nome do Conciliador"><div class="sig-label">Conciliador</div></div></div></div><div class="btn-area"><button class="btn btn-print" onclick="window.print()">Imprimir</button><button class="btn btn-pdf" onclick="gerarPDF()">Gerar PDF</button></div></div><script>const now=new Date();document.getElementById('data_atend').value=now.toISOString().split('T')[0];document.getElementById('hora_atend').value=now.toTimeString().slice(0,5);function togglePrazo(el){document.getElementById('prazo_info').classList.toggle('visible',el.value==='0800 com protocolo');}function maskCPF(el){let v=el.value.replace(/\D/g,'').slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');el.value=v;}function maskPhone(el){let v=el.value.replace(/\D/g,'').slice(0,11);el.value=v.length<=10?v.replace(/^(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3'):v.replace(/^(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');}function val(id){return document.getElementById(id)?.value?.trim()||'-';}function radioVal(n){const el=document.querySelector('input[name="'+n+'"]:checked');return el?el.value:'-';}function fmtDate(s){if(!s||s==='-')return '-';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y;}function gerarPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});const W=210,mg=12,cw=W-mg*2;let y=10;const az=[0,48,135],ci=[80,80,80],cl=[220,230,245],ve=[192,57,43];doc.setFillColor(...az);doc.rect(0,0,W,28,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('TERMO DE ATENDIMENTO AO CONSUMIDOR',W/2,y+6,{align:'center'});doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Concilie x TIM | PROCON',W/2,y+12,{align:'center'});doc.setFillColor(255,255,255);doc.roundedRect(W/2-42,y+14,84,9,2,2,'F');doc.setTextColor(...az);doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text('PROTOCOLO CONCILIE:',W/2-38,y+19.5);doc.setFontSize(10);doc.text(val('proto_concilie'),W/2+16,y+19.5,{align:'center'});y=33;doc.setTextColor(0,0,0);function sT(t){doc.setFillColor(...az);doc.rect(mg,y,cw,5.5,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text(t.toUpperCase(),mg+2,y+3.8);doc.setTextColor(0,0,0);y+=7;}function lv(lb,vl,x,w,ry){doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(...ci);doc.text(lb.toUpperCase(),x,ry);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(0,0,0);doc.text(String(vl),x,ry+4.5);doc.setDrawColor(180,180,180);doc.setLineWidth(.25);doc.line(x,ry+5.5,x+w,ry+5.5);}sT('Identificacao do Atendimento');lv('Cidade/PROCON',val('cidade'),mg,48,y);lv('Data',fmtDate(val('data_atend')),mg+52,32,y);lv('Horario',val('hora_atend'),mg+88,26,y);lv('Protocolo TIM',val('proto_tim'),mg+118,cw-118+mg,y);y+=11;const tipo=radioVal('tipo');lv('Tipo de Consulta',tipo,mg,cw,y);y+=9;if(tipo==='0800 com protocolo'){doc.setFillColor(253,240,238);doc.rect(mg,y,cw,5.5,'F');doc.setTextColor(...ve);doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.text('Prazo de 5 dias uteis para retorno ao consumidor.',mg+2,y+3.8);doc.setTextColor(0,0,0);y+=7;}sT('Dados do Consumidor');lv('Nome',val('nome'),mg,cw*.5-2,y);lv('CPF',val('cpf'),mg+cw*.5+2,cw*.2-2,y);lv('Nascimento',fmtDate(val('nasc')),mg+cw*.7+4,cw*.27,y);y+=11;lv('Sexo',radioVal('sexo'),mg,28,y);lv('Num Reclamado',val('num_reclamado'),mg+32,46,y);lv('Num Contato',val('num_contato'),mg+82,46,y);lv('E-mail',val('email'),mg+132,cw-132+mg,y);y+=11;sT('Reclamacao do Consumidor');const recl=val('reclamacao');const rL=doc.splitTextToSize(recl,cw-4);const rH=Math.max(rL.length*4.5+4,18);doc.setDrawColor(180,180,180);doc.setLineWidth(.3);doc.rect(mg,y,cw,rH,'S');doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(rL,mg+2,y+4);y+=rH+3;sT('Proposta da Operadora');const prop=val('proposta');const pL=doc.splitTextToSize(prop,cw-4);const pH=Math.max(pL.length*4.5+4,18);doc.setDrawColor(180,180,180);doc.rect(mg,y,cw,pH,'S');doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(pL,mg+2,y+4);y+=pH+4;sT('Assinaturas');y+=8;const half=(cw-16)/2;doc.setDrawColor(60,60,60);doc.setLineWidth(.4);doc.line(mg,y,mg+half,y);doc.line(mg+half+16,y,mg+cw,y);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...ci);doc.text(val('nome_consumidor_assin')!=='-'?val('nome_consumidor_assin'):'(Consumidor)',mg+half/2,y+4,{align:'center'});doc.text('Consumidor',mg+half/2,y+8,{align:'center'});const cx2=mg+half+16+half/2;doc.text(val('nome_conciliador')!=='-'?val('nome_conciliador'):'(Conciliador)',cx2,y+4,{align:'center'});doc.text('Conciliador',cx2,y+8,{align:'center'});doc.setFontSize(6.5);doc.setTextColor(160,160,160);doc.text('Gerado em '+fmtDate(now.toISOString().split("T")[0])+' - Concilie x TIM PROCON',W/2,291,{align:'center'});doc.save('Termo_'+val('cidade')+'_'+val('data_atend')+'.pdf');}</script></body></html>
